name: Android Instrumentation Tests (PR)

on:
  pull_request:
    branches:
      - main
      - develop
      - release

jobs:
  instrumentation:
    name: Connected Android Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # The Android SDK and emulator are provisioned by the emulator runner below.
      # Use JDK 17 so sdkmanager (part of cmdline-tools) runs correctly on the runner.

      - name: Build APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          boot-timeout: 20m
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -wipe-data
          script: |
            adb wait-for-device
            until adb shell getprop sys.boot_completed | grep -m 1 '1'; do
              sleep 5
            done
            adb shell input keyevent 82
            ./gradlew :app:connectedDebugAndroidTest --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-results
          path: app/build/reports/androidTests/connected
