name: Android Instrumentation Tests (PR)

on:
  pull_request:
    branches:
      - main
      - develop
      - release

jobs:
  instrumentation:
    name: Connected Android Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Download Android SDK (minimal)
        uses: android-actions/setup-android@v2
        with:
          api-level: 30
          build-tools: '33.0.2'

      - name: Build APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -no-audio
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-results
          path: app/build/reports/androidTests/connected
